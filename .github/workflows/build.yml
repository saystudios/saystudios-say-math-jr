name: Build & Test

# Compiles the app, runs the unit tests and takes screenshots on a cloud Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          xcodebuild test \
            -project SayMathJr.xcodeproj \
            -scheme SayMathJr \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/Build/Products -name "SayMathJr.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p screenshots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.saystudios.saymathjr 2>/dev/null || true
            xcrun simctl launch "$UDID" com.saystudios.saymathjr "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot 1-onboarding -demoScreen onboarding
          shot 2-home       -demoScreen home -demoGrade K
          shot 3-counting   -demoScreen lesson -demoSkill counting -demoGrade K
          shot 4-correct    -demoScreen lessonCorrect -demoSkill addition -demoGrade K
          shot 5-wrong      -demoScreen lessonWrong -demoSkill shapes -demoGrade 1
          shot 6-result     -demoScreen result -demoSkill patterns -demoGrade K
          shot 7-stickers   -demoScreen stickers -demoGrade K
          shot 8-clock      -demoScreen lesson -demoSkill time -demoGrade 1
          shot 9-home-grade2 -demoScreen home -demoGrade 2

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Save screenshots to the ci-screenshots branch
        if: always()
        run: |
          cd screenshots
          for f in *.png; do sips -Z 1200 "$f" >/dev/null; done
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

name: Build & Test

# Compiles the app and runs the unit tests on a cloud Mac — no Mac needed on your side.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          xcodebuild test \
            -project SayMathJr.xcodeproj \
            -scheme SayMathJr \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

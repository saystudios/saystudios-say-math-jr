name: SayMathJr
options:
  bundleIdPrefix: com.saystudios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SayMathJr:
    type: application
    platform: iOS
    sources:
      - path: SayMathJr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saystudios.saymathjr
        PRODUCT_NAME: SayMathJr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Say Math Jr."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
  SayMathJrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SayMathJrTests
    dependencies:
      - target: SayMathJr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.saystudios.saymathjr.tests
schemes:
  SayMathJr:
    build:
      targets:
        SayMathJr: all
        SayMathJrTests: [test]
    test:
      targets:
        - SayMathJrTests
